<style>
  /* =============================
     Chart Layout Styles
     ============================= */
  .chart-container {
    padding: 20px;
    background: white;
    margin: 0 auto;
  }

  .chart-grid {
    display: grid;
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .chart-grid.two-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
  }

  .chart-grid.one-column {
    grid-template-columns: 1fr;
  }

  .key-chart {
    border: 2px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px;
    background: white;
    break-inside: avoid;
  }

 @media (max-width: 768px) {
    /* Keep 2 columns for comparison */
    .chart-grid.two-column {
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }

    /* Fix container overflow */
    .chart-container {
      max-width: 100%;
      overflow-x: hidden;
      padding: 5px;
    }

    /* Minimize card padding */
    .key-chart {
      padding: 5px;
      margin-bottom: 5px;
    }

    /* Minimize title size and spacing */
    .key-title {
      /* font-size: 12px; */
      margin: 0;
      padding: 1px 0;
      line-height: 1;
    }

    /* Remove SVG margins */
    .key-chart svg {
      margin: 0;
      display: block;
      max-width: 100%;
      height: auto;
    }
  }

  /* Override any external font-size for note labels */
  .note-label {
    font-size: 18px !important;
    fill: #111;
    text-anchor: middle;
    user-select: none;
  }

  /* =============================
     Landmarks & Characters dropdown
     ============================= */
  .landmarks-dropdown {
    position: relative;
  }

  #landmarks-btn {
    min-width: 230px;
    cursor: pointer;
  }

  .landmarks-menu {
    position: fixed; /* escapes the horizontally-scrolling .controls bar */
    z-index: 2000;
    background: #fff;
    border: 1px solid #ced4da;
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
    padding: 10px 14px;
    min-width: 260px;
    max-width: calc(100vw - 20px);
    max-height: 60vh;
    overflow-y: auto;
  }

  .lm-group {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #888;
    margin: 10px 0 4px;
  }

  .lm-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    margin: 0;
    cursor: pointer;
    white-space: nowrap;
  }

  .lm-all {
    font-weight: 600;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }

  .lm-option {
    color: #666;
    font-size: 14px;
    border-top: 1px dashed #eee;
    margin-top: 4px;
    padding-top: 8px;
  }

  .site-logo {
    height: 34px;
    width: auto;
    flex-shrink: 0;
  }

  .landmark-marker {
    font-size: 15px;
    text-anchor: middle;
    user-select: none;
  }

</style>

<script>
  /* =============================================================================
     Geometry: Scaled down for reference chart
     ============================================================================= */
  const GEOM = {
    groupY: 40,
    whiteW: 50,
    whiteH: 180,
    blackH: 110,
    unit1W: 3*50,
    unit2W: 4*50,
    dotRadius: 12,

    unitLabelAboveOffset: -4,
    unitLabelBelowOffset: 40,
    noteLabelBelowOffset: 18,
    noteLabelWithUnitBelowOffset: -8
  };

  const Y = {
    keyTop:    GEOM.groupY,
    keyBottom: GEOM.groupY + GEOM.whiteH,
    unitAbove: GEOM.groupY + GEOM.unitLabelAboveOffset,
    unitBelow: GEOM.groupY + GEOM.whiteH + GEOM.unitLabelBelowOffset,
    labelBelowDefault: GEOM.groupY + GEOM.whiteH + GEOM.noteLabelBelowOffset,
    labelBelowWhenUnitsBelow: GEOM.groupY + GEOM.whiteH + GEOM.noteLabelWithUnitBelowOffset
  };

  /* =============================================================================
     Same helper functions from units.html
     ============================================================================= */
  const SHARP_TO_FLAT = {
      // Sharps to flats
      "C#":"Db","D#":"Eb","F#":"Gb","G#":"Ab","A#":"Bb",
      // Sharp naturals to naturals
      "E#":"F","B#":"C",
      // Flat naturals to naturals (fixes Cb = B issue)
      "Cb":"B","Fb":"E"
  };
  const toFlat = n => SHARP_TO_FLAT[n] || n;
  const normalize = toFlat;
  const prefersSharps = key => ["G","D","A","E","B","F#","C#"].includes(key);
  function displayName(norm, preferSharpsFlag){
    if (!preferSharpsFlag) 
      return norm.replace('#', '♯').replace('b', '♭');
    const FLAT_TO_SHARP = {"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#"};
    let result = FLAT_TO_SHARP[norm] || norm;
     // Replace # and b with musical symbols
    result = result.replace('#', '♯').replace('b', '♭');
    return result;

  }

  const MAJOR = {
    "C":  ["C","D","E","F","G","A","B","C"],
    "G":  ["G","A","B","C","D","E","F#","G"],
    "D":  ["D","E","F#","G","A","B","C#","D"],
    "A":  ["A","B","C#","D","E","F#","G#","A"],
    "E":  ["E","F#","G#","A","B","C#","D#","E"],
    "B":  ["B","C#","D#","E","F#","G#","A#","B"],
    "F#": ["F#","G#","A#","B","C#","D#","E#","F#"],
    "Gb": ["Gb","Ab","Bb","Cb","Db","Eb","F","Gb"],
    "Db": ["Db","Eb","F","Gb","Ab","Bb","C","Db"],
    "Ab": ["Ab","Bb","C","Db","Eb","F","G","Ab"],
    "Eb": ["Eb","F","G","Ab","Bb","C","D","Eb"],
    "Bb": ["Bb","C","D","Eb","F","G","A","Bb"],
    "F":  ["F","G","A","Bb","C","D","E","F"]
  };

  // Key order for the chart
  const KEY_ORDER = ["C", "G", "D", "A", "E", "B", "Gb", "Db", "Ab", "Eb", "Bb", "F"];

  /* =============================================================================
     Landmarks & Characters
     - Fixed landmarks live on physical keys and never move.
     - Landscape markers and Characters are measured from Camp (the chart's key),
       in semitones ("Wave steps") above Camp.
     ============================================================================= */
  const PITCH_CLASS = {"C":0,"Db":1,"D":2,"Eb":3,"E":4,"F":5,"Gb":6,"G":7,"Ab":8,"A":9,"Bb":10,"B":11};
  const PC_NAMES = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  const BLACK_KEYS = ["Db","Eb","Gb","Ab","Bb"];
  const SVG_NS = "http://www.w3.org/2000/svg";
  const TRACK_COLORS = { red: "#E02424", blue: "#1E90FF", grey: "#C4C4C4" };
  const noteFromCamp = (key, semis) => PC_NAMES[(PITCH_CLASS[normalize(key)] + semis) % 12];

  const LANDMARK_MARKERS = [
    // Fixed landmarks. Border flags follow Tony's drawings:
    // red flags for Unit 1 (C, E), blue flags for Unit 2 (F, B),
    // greyed out when that key is not on the Path of the chart's Landscape.
    { id: "borders",     type: "fixed",
      points: [ {note:"C", shape:"flag", color:"red"},  {note:"E", shape:"flag", color:"red"},
                {note:"F", shape:"flag", color:"blue"}, {note:"B", shape:"flag", color:"blue"} ] },
    // Center Stage: green star, like Tony's drawing (D and Ab)
    { id: "centerstage", type: "fixed",
      points: [ {note:"D", shape:"star"}, {note:"Ab", shape:"star"} ] },

    // Landscape markers, relative to Camp
    { id: "campfire",    type: "relative",
      points: [ {semis:0, emoji:"\u26FA"}, {semis:4, emoji:"\u{1F525}"} ] },
    { id: "middlekey",   type: "relative",
      points: [ {semis:6, emoji:"\u{1F511}"} ] },

    // Center Stages of the Path (4 & 7) — the spotlight notes that demand resolution.
    // Each gets a glowing star plus its role, and shows its resolution target.
    { id: "suspension",  type: "relative",
      points: [ {semis:5, emoji:"\u{1F31F}"}, {semis:5, emoji:"\u23F8\uFE0F"}, {semis:4, emoji:"\u{1F525}"} ],
      arrow: { fromSemis: 5, toSemis: 4, color: "#e67e22" } },
    { id: "leadingtone", type: "relative",
      points: [ {semis:11, emoji:"\u{1F31F}"}, {semis:11, emoji:"\u{1F3A4}"}, {semis:0, emoji:"\u26FA"} ],
      arrow: { fromSemis: 11, toSemis: 0, color: "#5b7fd4" } },

    // Characters, relative to Camp
    { id: "architect",   type: "relative", points: [ {semis:1,  emoji:"\u{1F4D0}"} ] },
    { id: "author",      type: "relative", points: [ {semis:3,  emoji:"\u270D\uFE0F"} ] },
    { id: "magician",    type: "relative", points: [ {semis:6,  emoji:"\u{1F3A9}"} ] },
    { id: "kingqueen",   type: "relative", points: [ {semis:8,  emoji:"\u{1FAC5}"} ] },
    { id: "traveler",    type: "relative", points: [ {semis:10, emoji:"\u{1F9F3}"} ] }
  ];

  // UI state
  let showingTwo = false; // Start with single octave for reference chart
  let startOnUnit1 = true;
  let showingLabels = false;
  let unitLabelPos = "above"; // "above" | "below" | "hidden"
  let layoutMode = "two-column";
  let selectedLandmarks = new Set();
  let showArrows = true; // resolution arrows for Center Stages (4 & 7)

  /* =============================
     SVG Generation Functions
     ============================= */
  function generateKeyboardSVG(keyName, octaves = 1) {
    const totalWidth = octaves === 1 ? 350 : 700;
    const viewBoxHeight = 280;

    let svg = `<svg viewBox="0 0 ${totalWidth} ${viewBoxHeight}" xmlns="http://www.w3.org/2000/svg" aria-label="${keyName} major keyboard">`;

    // Generate octaves
    for (let oct = 1; oct <= octaves; oct++) {
      const octaveOffset = (oct - 1) * 350;

      // Octave title
      if (octaves > 1) {
        svg += `<text class="octave-label" x="${170 + octaveOffset}" y="30">Octave ${oct}</text>`;
      }

      // Unit labels
      const unitY = unitLabelPos === "above" ? Y.unitAbove : Y.unitBelow;
      const unitDisplay = unitLabelPos === "hidden" ? "none" : "inline";

      const unit1Label = startOnUnit1 ? "Unit 1" : "Unit 2";
      const unit2Label = startOnUnit1 ? "Unit 2" : "Unit 1";

      svg += `<text class="unit-label" x="${75 + octaveOffset}" y="${unitY}" style="display:${unitDisplay}">${unit1Label}</text>`;
      svg += `<text class="unit-label" x="${250 + octaveOffset}" y="${unitY}" style="display:${unitDisplay}">${unit2Label}</text>`;

      // Generate units
      svg += generateUnit(oct, 1, octaveOffset);
      svg += generateUnit(oct, 2, octaveOffset);
    }

    svg += '</svg>';
    return svg;
  }

  function generateUnit(octave, unit, octaveOffset) {
    const isUnit1 = unit === 1;
    const unitOffset = startOnUnit1
      ? (isUnit1 ? 0 : GEOM.unit1W)
      : (isUnit1 ? GEOM.unit2W : 0);

    const keys = isUnit1 ? ["C", "D", "E"] : ["F", "G", "A", "B"];
    const blackKeys = isUnit1 ? ["Db", "Eb"] : ["Gb", "Ab", "Bb"];

    let unitSvg = `<g transform="translate(${octaveOffset + unitOffset},${GEOM.groupY})">`;

    // White keys
    keys.forEach((key, i) => {
      unitSvg += `<rect x="${i * GEOM.whiteW}" y="0" width="${GEOM.whiteW}" height="${GEOM.whiteH}" fill="white" stroke="black" stroke-width="2"/>`;
    });

    // Black keys
    if (isUnit1) {
      unitSvg += `<rect x="${GEOM.whiteW - 14}" y="0" width="30" height="${GEOM.blackH}" fill="black"/>`;
      unitSvg += `<rect x="${2 * GEOM.whiteW - 14}" y="0" width="30" height="${GEOM.blackH}" fill="black"/>`;
    } else {
      unitSvg += `<rect x="${GEOM.whiteW - 14}" y="0" width="30" height="${GEOM.blackH}" fill="black"/>`;
      unitSvg += `<rect x="${2 * GEOM.whiteW - 14}" y="0" width="30" height="${GEOM.blackH}" fill="black"/>`;
      unitSvg += `<rect x="${3 * GEOM.whiteW - 14}" y="0" width="30" height="${GEOM.blackH}" fill="black"/>`;
    }

    // Dots for white keys
    keys.forEach((key, i) => {
      const track = (isUnit1 && !startOnUnit1) || (!isUnit1 && startOnUnit1) ? "blue" : "red";
      unitSvg += `<circle class="dot" cx="${i * GEOM.whiteW + GEOM.whiteW/2}" cy="${GEOM.whiteH - 30}" r="${GEOM.dotRadius}" data-key="${key}" data-track="${track}"/>`;
    });

    // Dots for black keys
    if (isUnit1) {
      const track = startOnUnit1 ? "blue" : "red";
      unitSvg += `<circle class="dot" cx="${GEOM.whiteW - 14 + 15}" cy="${GEOM.blackH - 20}" r="${GEOM.dotRadius}" data-key="Db" data-track="${track}"/>`;
      unitSvg += `<circle class="dot" cx="${2 * GEOM.whiteW - 14 + 15}" cy="${GEOM.blackH - 20}" r="${GEOM.dotRadius}" data-key="Eb" data-track="${track}"/>`;
    } else {
      const track = startOnUnit1 ? "red" : "blue";
      unitSvg += `<circle class="dot" cx="${GEOM.whiteW - 14 + 15}" cy="${GEOM.blackH - 20}" r="${GEOM.dotRadius}" data-key="Gb" data-track="${track}"/>`;
      unitSvg += `<circle class="dot" cx="${2 * GEOM.whiteW - 14 + 15}" cy="${GEOM.blackH - 20}" r="${GEOM.dotRadius}" data-key="Ab" data-track="${track}"/>`;
      unitSvg += `<circle class="dot" cx="${3 * GEOM.whiteW - 14+ 15}" cy="${GEOM.blackH - 20}" r="${GEOM.dotRadius}" data-key="Bb" data-track="${track}"/>`;
    }

    unitSvg += '</g>';
    return unitSvg;
  }

  /* =============================
     Chart Generation
     ============================= */
  function generateChart() {
    const container = document.getElementById('chart-grid');
    container.innerHTML = '';
    container.className = `chart-grid ${layoutMode}`;

    const octaves = layoutMode === "one-column" ? 2 : 1;

    KEY_ORDER.forEach(key => {
      const chartDiv = document.createElement('div');
      chartDiv.className = 'key-chart';
      chartDiv.innerHTML = `
        <div class="key-title">${key} Major</div>
        ${generateKeyboardSVG(key, octaves)}
      `;
      container.appendChild(chartDiv);

      // Apply scale and show dots
      applyScaleToChart(chartDiv, key);
      if (showingLabels) {
        showLabelsForChart(chartDiv, key);
      }
      addMarkersToChart(chartDiv, key);
    });
  }

  function applyScaleToChart(chartDiv, key) {
    const notes = MAJOR[key] || [];
    const dots = chartDiv.querySelectorAll('.dot');

    dots.forEach(dot => {
      const dotKey = dot.getAttribute('data-key');
      const isInScale = notes.some(note => normalize(note) === normalize(dotKey));
      dot.style.opacity = isInScale ? '1' : '0';
    });
  }

  function showLabelsForChart(chartDiv, key) {
    const svg = chartDiv.querySelector('svg');
    const notes = MAJOR[key] || [];
    const mode = document.getElementById("label-mode").value;
    const preferSharpsFlag = prefersSharps(key);

    // Remove existing labels
    const existingLabels = svg.querySelectorAll('.note-label');
    existingLabels.forEach(label => label.remove());

    // Scale degree names
    const degNames = {};
    notes.forEach((n, i) => {
      degNames[normalize(n)] = (i === notes.length - 1) ? "1" : String(i + 1);
    });

    const baseline = Y.labelBelowDefault;

    const octaves = layoutMode === "one-column" ? 2 : 1;

    for (let oct = 1; oct <= octaves; oct++) {
      notes.forEach(nRaw => {
        const n = normalize(nRaw);
        const text = (mode === "letters") ? displayName(n, preferSharpsFlag) : degNames[n];
        if (!text) return;

        const x = getXForNote(n, oct);
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", x);
        label.setAttribute("y", baseline);
        label.setAttribute("class", "note-label");
        label.textContent = text;
        svg.appendChild(label);
      });
    }
  }

  /* =============================
     Landmark & Character Markers
     ============================= */
  function addMarkersToChart(chartDiv, key) {
    if (selectedLandmarks.size === 0) return;
    const svg = chartDiv.querySelector('svg');
    const octaves = layoutMode === "one-column" ? 2 : 1;
    const inKeySet = new Set((MAJOR[key] || []).map(normalize));

    for (let oct = 1; oct <= octaves; oct++) {
      const stacks = {}; // markers stack upward when several land on the same key
      const placed = new Set(); // don't repeat the same marker on the same key (e.g. Camp from two sources)

      const place = (note, p) => {
        const dedupe = note + "|" + (p.emoji || p.shape);
        if (placed.has(dedupe)) return;
        placed.add(dedupe);
        const x = getXForNote(note, oct);
        const isBlack = BLACK_KEYS.includes(note);
        const level = stacks[note] = (stacks[note] || 0) + 1;
        // White keys: just above the dot. Black keys: above the black-key dot.
        const baseY = isBlack ? (GEOM.groupY + GEOM.blackH - 40) : (GEOM.groupY + GEOM.whiteH - 52);
        const y = baseY - (level - 1) * 22;

        if (p.shape === "flag") {
          // Unit border flag; greyed out when the key is not on the Path
          const onPath = inKeySet.has(note);
          const fill = onPath ? TRACK_COLORS[p.color] : "#ffffff";
          const stroke = onPath ? TRACK_COLORS[p.color] : TRACK_COLORS.grey;
          const pole = onPath ? "#333333" : TRACK_COLORS.grey;
          const g = document.createElementNS(SVG_NS, "g");
          g.setAttribute("transform", `translate(${x - 5}, ${y - 22})`);
          g.innerHTML =
            `<line x1="0" y1="0" x2="0" y2="22" stroke="${pole}" stroke-width="1.6"/>` +
            `<circle cx="0" cy="0" r="1.6" fill="${pole}"/>` +
            `<path d="M0,2 C5,-1 9,4 14,1 L14,9 C9,12 5,7 0,10 Z" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>`;
          svg.appendChild(g);
          return;
        }

        if (p.shape === "star") {
          // Fixed Center Stage: green star, like Tony's drawing
          const g = document.createElementNS(SVG_NS, "g");
          g.setAttribute("transform", `translate(${x}, ${y - 8})`);
          g.innerHTML = `<polygon points="0,-9 2.1,-2.9 8.6,-2.8 3.4,1.1 5.3,7.3 0,3.6 -5.3,7.3 -3.4,1.1 -8.6,-2.8 -2.1,-2.9" fill="#2EAE4F" stroke="#1B7A36" stroke-width="1"/>`;
          svg.appendChild(g);
          return;
        }

        const t = document.createElementNS(SVG_NS, "text");
        t.setAttribute("x", x);
        t.setAttribute("y", y);
        t.setAttribute("class", "landmark-marker");
        t.textContent = p.emoji;
        svg.appendChild(t);
      };

      const drawArrow = (fromNote, toNote, color, direction) => {
        const x1 = getXForNote(fromNote, oct);
        const fromLocalX = getXForNote(fromNote, 1);
        const toLocalX = getXForNote(toNote, 1);
        let targetOct = oct;

        // Follow the musical direction across the displayed octave boundary.
        if (direction > 0 && toLocalX < fromLocalX) targetOct += 1;
        if (direction < 0 && toLocalX > fromLocalX) targetOct -= 1;
        if (targetOct < 1 || targetOct > octaves) return;

        const x2 = getXForNote(toNote, targetOct);
        if (x1 === x2) return;
        const y = GEOM.groupY + GEOM.whiteH - 8; // just under the dots, inside the keys
        const dir = x2 > x1 ? 1 : -1;

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y);
        line.setAttribute("x2", x2 - dir * 8);
        line.setAttribute("y2", y);
        line.setAttribute("stroke", color);
        line.setAttribute("stroke-width", "2.5");
        svg.appendChild(line);

        const head = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        head.setAttribute("points", `${x2},${y} ${x2 - dir * 9},${y - 5} ${x2 - dir * 9},${y + 5}`);
        head.setAttribute("fill", color);
        svg.appendChild(head);
      };

      LANDMARK_MARKERS.forEach(m => {
        if (!selectedLandmarks.has(m.id)) return;

        m.points.forEach(p => {
          const note = (m.type === "fixed") ? p.note : noteFromCamp(key, p.semis);
          place(note, p);
        });

        if (m.arrow && showArrows) {
          const direction = ((m.arrow.toSemis - m.arrow.fromSemis + 18) % 12) - 6;
          drawArrow(
            noteFromCamp(key, m.arrow.fromSemis),
            noteFromCamp(key, m.arrow.toSemis),
            m.arrow.color,
            direction
          );
        }
      });
    }
  }

  function getXForNote(note, octave) {
    const octaveOffset = (octave - 1) * 350;
    const isUnit1Note = ["C", "D", "E", "Db", "Eb"].includes(note);

    const unitOffset = startOnUnit1
      ? (isUnit1Note ? 0 : GEOM.unit1W)
      : (isUnit1Note ? GEOM.unit2W : 0);

    const localPositions = {
      "C": 25, "D": 75, "E": 125, "Db": 51, "Eb": 101,
      "F": 25, "G": 75, "A": 125, "B": 175, "Gb": 51, "Ab": 101, "Bb": 151
    };

    return octaveOffset + unitOffset + (localPositions[note] || 0);
  }

  /* =============================
     Event Handlers
     ============================= */

  document.getElementById("toggle-start").addEventListener("click", () => {
    startOnUnit1 = !startOnUnit1;
    document.getElementById("toggle-start").textContent =
      startOnUnit1 ? "Start on Unit 1" : "Start on Unit 2";
    generateChart();
  });

  document.getElementById("unit-label-pos").addEventListener("change", (e) => {
    unitLabelPos = e.target.value;
    generateChart();
  });

  document.getElementById("toggle-octaves").addEventListener("click", () => {
    showingTwo = !showingTwo;
    layoutMode = showingTwo ? "one-column" : "two-column";
    const btn = document.getElementById("toggle-octaves");
    btn.textContent = showingTwo ? "Show One Octave" : "Show Two Octaves";
    generateChart();
  });

  document.getElementById("label-mode").addEventListener("change", (e) => {
    const mode = e.target.value;
    if (mode === "hide") {
      showingLabels = false;
    } else {
      showingLabels = true;
    }
    generateChart();
  });

  /* =============================
     Landmarks dropdown behavior
     ============================= */
  const landmarksBtn = document.getElementById("landmarks-btn");
  const landmarksMenu = document.getElementById("landmarks-menu");
  const landmarkChecks = Array.from(document.querySelectorAll(".lm-check"));
  const selectAllCheck = document.getElementById("lm-select-all");

  landmarksBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const opening = landmarksMenu.hidden;
    if (opening) {
      // Menu is position:fixed so it isn't clipped by the horizontally-scrolling
      // controls bar; anchor it to the button each time it opens.
      const r = landmarksBtn.getBoundingClientRect();
      landmarksMenu.style.top = (r.bottom + 4) + "px";
      landmarksMenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 290)) + "px";
    }
    landmarksMenu.hidden = !opening;
    landmarksBtn.setAttribute("aria-expanded", String(opening));
  });

  // Keep the menu open while checking boxes
  landmarksMenu.addEventListener("click", (e) => e.stopPropagation());

  function closeLandmarksMenu() {
    landmarksMenu.hidden = true;
    landmarksBtn.setAttribute("aria-expanded", "false");
  }

  // Close when clicking anywhere else, or when the button moves out from under the menu
  document.addEventListener("click", closeLandmarksMenu);
  document.querySelector(".controls").addEventListener("scroll", closeLandmarksMenu);
  window.addEventListener("resize", closeLandmarksMenu);

  // Resolution arrows toggle (keeps the 4 & 7 symbols, hides just the arrows)
  document.getElementById("lm-arrows").addEventListener("change", (e) => {
    showArrows = e.target.checked;
    generateChart();
  });

  function updateLandmarkSelection() {
    selectedLandmarks = new Set(landmarkChecks.filter(c => c.checked).map(c => c.value));

    selectAllCheck.checked = selectedLandmarks.size === landmarkChecks.length;
    selectAllCheck.indeterminate = selectedLandmarks.size > 0 && selectedLandmarks.size < landmarkChecks.length;

    landmarksBtn.textContent = selectedLandmarks.size > 0
      ? `Landmarks & Characters (${selectedLandmarks.size})`
      : "Landmarks & Characters";

    generateChart();
  }

  landmarkChecks.forEach(c => c.addEventListener("change", updateLandmarkSelection));

  selectAllCheck.addEventListener("change", () => {
    landmarkChecks.forEach(c => c.checked = selectAllCheck.checked);
    updateLandmarkSelection();
  });

  /* =============================
     Mobile header collapse on scroll
     ============================= */
  let lastScrollY = window.scrollY;
  const header = document.querySelector('header');

  function handleScroll() {
    if (window.innerWidth <= 768) {
      if (window.scrollY > lastScrollY && window.scrollY > 50) {
        // Scrolling down - collapse header
        header.classList.add('header-collapsed');
      } else if (window.scrollY < lastScrollY) {
        // Scrolling up - show full header
        header.classList.remove('header-collapsed');
      }
    } else {
      // Desktop - always show full header
      header.classList.remove('header-collapsed');
    }
    lastScrollY = window.scrollY;
  }

  window.addEventListener('scroll', handleScroll);
  window.addEventListener('resize', handleScroll);

  // Initial generation
  generateChart();
</script>
</body>
</html>

<script>
  /* =============================================================================
     Geometry: NO magic numbers outside this block.
     Change these to adjust positions everywhere consistently.
     ============================================================================= */
  const GEOM = {
    groupY: 60,           // translateY for each octave group
    whiteW: 80,
    whiteH: 300,
    blackW: 50,
    blackH: 180,
    dotRadius: 18,
    unit1W: 3*80,         // C D E
    unit2W: 4*80,         // F G A B
    whiteDotY: 270,
    blackDotY: 150,

    // Label offsets relative to key top/bottom
    unitLabelAboveOffset: -6,  // a bit above the key tops
    unitLabelBelowOffset: 52,  // comfortably below keys
    noteLabelBelowOffset:  24, // below keys when unit labels are above/hidden
    noteLabelWithUnitBelowOffset: 28 // below keys, above "Unit" text (matches reference-chart spacing)
  };

  // Derived Y positions (global SVG coords)
  const Y = {
    keyTop:    GEOM.groupY,
    keyBottom: GEOM.groupY + GEOM.whiteH,
    unitAbove: GEOM.groupY + GEOM.unitLabelAboveOffset,
    unitBelow: GEOM.groupY + GEOM.whiteH + GEOM.unitLabelBelowOffset,
    labelBelowDefault: GEOM.groupY + GEOM.whiteH + GEOM.noteLabelBelowOffset,
    labelBelowWhenUnitsBelow: GEOM.groupY + GEOM.whiteH + GEOM.noteLabelWithUnitBelowOffset
  };

  /* =============================================================================
     Enharmonics / naming helpers
     ============================================================================= */
  const SHARP_TO_FLAT = {
    // Sharps to flats
    "C#":"Db","D#":"Eb","F#":"Gb","G#":"Ab","A#":"Bb",
    // Sharp naturals to naturals
    "E#":"F","B#":"C",
    // Flat naturals to naturals (fixes Cb = B issue)
    "Cb":"B","Fb":"E"
  };
  const toFlat     = n => SHARP_TO_FLAT[n] || n;
  const normalize  = toFlat;
  const prefersSharps = key => ["G","D","A","E","B","F#","C#"].includes(key);
  function displayName(norm, preferSharpsFlag){
    if (!preferSharpsFlag)
      return norm.replace('#', '♯').replace('b', '♭');
    const FLAT_TO_SHARP = {"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#"};
    let result = FLAT_TO_SHARP[norm] || norm;
     // Replace # and b with musical symbols
    result = result.replace('#', '♯').replace('b', '♭');
    return result;
  }

  /* =============================================================================
     Major scales (single-octave definition)
     Keep this expanded & commented so adding scale families later is easy.
     ============================================================================= */
  const MAJOR = {
    "C":  ["C","D","E","F","G","A","B","C"],
    "G":  ["G","A","B","C","D","E","F#","G"],
    "D":  ["D","E","F#","G","A","B","C#","D"],
    "A":  ["A","B","C#","D","E","F#","G#","A"],
    "E":  ["E","F#","G#","A","B","C#","D#","E"],
    "B":  ["B","C#","D#","E","F#","G#","A#","B"],
    "F#": ["F#","G#","A#","B","C#","D#","E#","F#"],
    "Gb": ["Gb","Ab","Bb","Cb","Db","Eb","F","Gb"],
    "Db": ["Db","Eb","F","Gb","Ab","Bb","C","Db"],
    "Ab": ["Ab","Bb","C","Db","Eb","F","G","Ab"],
    "Eb": ["Eb","F","G","Ab","Bb","C","D","Eb"],
    "Bb": ["Bb","C","D","Eb","F","G","A","Bb"],
    "F":  ["F","G","A","Bb","C","D","E","F"]
  };

  /* =============================================================================
     Landmarks & Characters, matching the Reference Chart:
     - Fixed landmarks live on physical keys and never move.
     - Landscape markers and Characters are measured in semitones ("Wave
       steps") above Camp. A selected key supplies Camp automatically; Custom
       Pattern keeps the established independent key-area Camp interaction so
       tapping dots continues to change only the Landscape.
     ============================================================================= */
  const PITCH_CLASS = {"C":0,"Db":1,"D":2,"Eb":3,"E":4,"F":5,"Gb":6,"G":7,"Ab":8,"A":9,"Bb":10,"B":11};
  const PC_NAMES = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  const BLACK_KEYS = ["Db","Eb","Gb","Ab","Bb"];
  const SVG_NS = "http://www.w3.org/2000/svg";
  const TRACK_COLORS = { red: "#E02424", blue: "#1E90FF", grey: "#C4C4C4" };
  const REFERENCE_WHITE_KEY_WIDTH = 50;
  const MARKER_SCALE = GEOM.whiteW / REFERENCE_WHITE_KEY_WIDTH;
  const MARKER_STACK_GAP = 28 * MARKER_SCALE;
  const noteFromCamp = (camp, semis) => PC_NAMES[(PITCH_CLASS[normalize(camp)] + semis) % 12];

  const LANDMARK_MARKERS = [
    { id: "borders", type: "fixed",
      points: [ {note:"C", shape:"flag", color:"red"}, {note:"E", shape:"flag", color:"red"},
                {note:"F", shape:"flag", color:"blue"}, {note:"B", shape:"flag", color:"blue"} ] },
    { id: "centerstage", type: "fixed",
      points: [ {note:"D", shape:"star"}, {note:"Ab", shape:"star"} ] },
    { id: "campfire", type: "relative",
      points: [ {semis:0, emoji:"\u26FA"}, {semis:4, emoji:"\u{1F525}"} ] },
    { id: "middlekey", type: "relative",
      points: [ {semis:6, emoji:"\u{1F511}"} ] },
    { id: "suspension", type: "relative",
      points: [ {semis:5, emoji:"\u23F8\uFE0F"} ],
      arrow: { fromSemis:5, toSemis:4, color:"#e67e22" } },
    { id: "leadingtone", type: "relative",
      points: [ {semis:11, emoji:"\u{1F3A4}"} ],
      arrow: { fromSemis:11, toSemis:0, color:"#5b7fd4" } },
    { id: "architect", type: "relative", points: [ {semis:1, emoji:"\u{1F4D0}"} ] },
    { id: "author", type: "relative", points: [ {semis:3, emoji:"\u270D\uFE0F"} ] },
    { id: "magician", type: "relative", points: [ {semis:6, emoji:"\u{1F3A9}"} ] },
    { id: "kingqueen", type: "relative", points: [ {semis:8, emoji:"\u{1FAC5}"} ] },
    { id: "traveler", type: "relative", points: [ {semis:10, emoji:"\u{1F9F3}"} ] }
  ];

  /* =============================================================================
     Free mode state (no key selected): user toggles notes on/off by clicking dots.
     We mirror across octaves & enharmonics.
     ============================================================================= */
  const manualOn = new Set();

  // UI state
  let selectedScale = "";   // empty = free mode
  let showingTwo    = true;
  let startOnUnit1  = true;
  let showingLabels = false;
  let unitLabelPos  = "above"; // "above" | "below" | "hidden"
  let customCamp = "C";
  let selectedLandmarks = new Set();
  let showArrows = true;

  /* =============================
     Dot utilities
     ============================= */
  function forEachDotOf(note, fn){
    const flat  = toFlat(note);
    const sharp = {"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#"}[flat];
    const spellings = [flat, sharp].filter(Boolean);
    [1,2].forEach(oct => {
      spellings.forEach(s => {
        document.querySelectorAll(`.dot[data-key="${s}"][data-octave="${oct}"]`).forEach(fn);
      });
    });
  }

  function applyManualDots(){
    document.querySelectorAll(".dot").forEach(d => d.classList.add("hidden"));
    manualOn.forEach(n => forEachDotOf(n, el => el.classList.remove("hidden")));
    updateDotAccessibility(true);
  }

  function applyScaleDots(){
    document.querySelectorAll(".dot").forEach(d => d.classList.add("hidden"));
    const notes = MAJOR[selectedScale] || [];
    notes.forEach(n => forEachDotOf(n, el => el.classList.remove("hidden")));
    updateDotAccessibility(false);
  }

  function updateDotAccessibility(interactive){
    document.querySelectorAll(".dot").forEach(dot => {
      if (interactive) {
        dot.setAttribute("role", "button");
        dot.setAttribute("tabindex", "0");
        dot.setAttribute("aria-label", `${dot.getAttribute("data-key")}, ${dot.getAttribute("data-track")} Track`);
        dot.setAttribute("aria-pressed", String(!dot.classList.contains("hidden")));
      } else {
        dot.removeAttribute("role");
        dot.removeAttribute("tabindex");
        dot.removeAttribute("aria-label");
        dot.removeAttribute("aria-pressed");
      }
    });
  }

  function onDotClick(e){
    if (selectedScale) return; // only toggle in free mode
    const note = toFlat(e.target.getAttribute("data-key"));
    if (manualOn.has(note)) manualOn.delete(note); else manualOn.add(note);
    applyManualDots();
    if (showingLabels) showNoteLabels("Free", Array.from(manualOn), false);
    renderLandmarks();
  }

  // Init dots: tag their octave & attach click handler
  document.querySelectorAll(".dot").forEach(dot => {
    const oct = dot.closest("[data-octave]").getAttribute("data-octave");
    dot.setAttribute("data-octave", oct);
    dot.classList.add("hidden");
    dot.addEventListener("click", onDotClick);
    dot.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      onDotClick(e);
    });
  });

  /* =============================
     Layout — Start on Unit & Unit label position
     ============================= */
  function getUnitLabels(oct){
    const left  = document.getElementById(`oct${oct}-left-label`);
    const right = document.getElementById(`oct${oct}-right-label`);
    return { left, right };
  }

  function applyStartLayout(){
    ["1","2"].forEach(oct => {
      const u1 = document.getElementById(`oct${oct}-u1`);
      const u2 = document.getElementById(`oct${oct}-u2`);
      const { left, right } = getUnitLabels(oct);
      const octaveOffset = (Number(oct) - 1) * (GEOM.unit1W + GEOM.unit2W);

      // Swap units horizontally when starting on Unit 2
      if (startOnUnit1){
        u1.setAttribute("transform",`translate(0,0)`);
        u2.setAttribute("transform",`translate(${GEOM.unit1W},0)`);  // after Unit 1
        if (left)  left.textContent  = "Unit 1";
        if (right) right.textContent = "Unit 2";
        if (left)  left.setAttribute("x", String(octaveOffset + 120));
        if (right) right.setAttribute("x", String(octaveOffset + 400));
      } else {
        u2.setAttribute("transform",`translate(0,0)`);
        u1.setAttribute("transform",`translate(${GEOM.unit2W},0)`);  // after Unit 2
        if (left)  left.textContent  = "Unit 2";
        if (right) right.textContent = "Unit 1";
        if (left)  left.setAttribute("x", String(octaveOffset + 160));
        if (right) right.setAttribute("x", String(octaveOffset + 440));
      }

      // Place/hide the "Unit 1 / Unit 2" texts
      const shouldHide = (unitLabelPos === "hidden") || (oct === "2" && !showingTwo);
      const y = (unitLabelPos === "above") ? Y.unitAbove : Y.unitBelow;
      [left, right].forEach(el => {
        if (!el) return;
        el.style.display = shouldHide ? "none" : "inline";
        el.setAttribute("y", String(y));
      });
    });

    document.getElementById("toggle-start").textContent =
      startOnUnit1 ? "Start on Unit 1" : "Start on Unit 2";
    updateCampTargets();
  }

  // ViewBox tweak for single-octave mobile view (prevents clipping)
  function updateSingleOctaveView(){
    const svg = document.getElementById("keyboard");
    const oct1Title = document.getElementById("oct1-title");

    if (!showingTwo && window.innerWidth <= 768) {
      svg.setAttribute("viewBox","0 0 600 450");
      oct1Title.setAttribute("x","300");
    } else {
      svg.setAttribute("viewBox","0 0 1160 450");
      oct1Title.setAttribute("x","280");
    }
  }

  /* =============================
     Note labels rendering
     ============================= */
  // live transforms (so Start-on-Unit swaps are respected)
  const parseTx = tr => { const m=/translate\(([-\d.]+),/.exec(tr||""); return m?parseFloat(m[1]):0; };
  const groupBase = oct => parseTx(document.getElementById(oct===1?"oct1":"oct2").getAttribute("transform"));
  const unitTx    = (oct,unit) => parseTx(document.getElementById(`oct${oct}-u${unit}`).getAttribute("transform"));

  // Local X within each unit (explicit for readability)
  const localCxU1 = { C:40, D:120, E:200, Db:80,  Eb:160 };
  const localCxU2 = { F:40, G:120, A:200, B:280, Gb:80, Ab:160, Bb:240 };
  const inU1      = n => ["C","D","E","Db","Eb"].includes(n);

  function xFor(note, oct){
    const unit = inU1(note) ? 1 : 2;
    return groupBase(oct) + unitTx(oct, unit) + (unit===1 ? localCxU1[note] : localCxU2[note]);
  }

  function updateCampTargets(){
    document.querySelectorAll("#labels-layer .camp-target").forEach(target => {
      const note = target.getAttribute("data-note");
      const octave = Number(target.getAttribute("data-octave"));
      const isCustom = !selectedScale;
      const isVisibleOctave = showingTwo || octave === 1;
      const isBlack = BLACK_KEYS.includes(note);
      const width = isBlack ? GEOM.blackW : GEOM.whiteW;
      const height = isBlack ? GEOM.blackH : GEOM.whiteH;
      const x = xFor(note, octave) - width / 2;
      const rectPath = (left, top, rectWidth, rectHeight) =>
        `M${left},${top}h${rectWidth}v${rectHeight}h${-rectWidth}Z`;
      let keyPath;
      if (isBlack) {
        keyPath = rectPath(x, GEOM.groupY, width, height);
      } else {
        let upperSegments = [[x, x + width]];
        BLACK_KEYS.forEach(blackNote => {
          const blackLeft = xFor(blackNote, octave) - GEOM.blackW / 2;
          const blackRight = blackLeft + GEOM.blackW;
          upperSegments = upperSegments.flatMap(([left, right]) => {
            if (blackRight <= left || blackLeft >= right) return [[left, right]];
            return [[left, Math.max(left, blackLeft)], [Math.min(right, blackRight), right]]
              .filter(([segmentLeft, segmentRight]) => segmentRight > segmentLeft);
          });
        });
        const upperPath = upperSegments.map(([left, right]) =>
          rectPath(left, GEOM.groupY, right - left, GEOM.blackH)).join("");
        const lowerPath = rectPath(x, GEOM.groupY + GEOM.blackH, width, GEOM.whiteH - GEOM.blackH);
        keyPath = upperPath + lowerPath;
      }
      const radius = GEOM.dotRadius;
      const dotX = xFor(note, octave);
      const dotY = GEOM.groupY + (isBlack ? GEOM.blackDotY : GEOM.whiteDotY);
      const dotHole = `M${dotX - radius},${dotY}a${radius},${radius} 0 1,0 ${2 * radius},0a${radius},${radius} 0 1,0 ${-2 * radius},0Z`;
      const isInteractive = isCustom && isVisibleOctave;
      target.setAttribute("d", keyPath + dotHole);
      target.setAttribute("aria-pressed", String(isInteractive && customCamp === note));
      target.setAttribute("tabindex", isInteractive ? "0" : "-1");
      target.style.display = isVisibleOctave ? "inline" : "none";
      target.style.pointerEvents = isInteractive ? "auto" : "none";
    });
  }

  function setCustomCamp(target){
    if (selectedScale) return;
    customCamp = normalize(target.getAttribute("data-note"));
    updateCampTargets();
    renderLandmarks();
  }

  function createCampTargets(){
    const layer = document.getElementById("labels-layer");
    [1, 2].forEach(octave => {
      const whiteNotes = PC_NAMES.filter(note => !BLACK_KEYS.includes(note));
      [...whiteNotes, ...BLACK_KEYS].forEach(note => {
        const target = document.createElementNS(SVG_NS, "path");
        target.setAttribute("class", "camp-target");
        target.setAttribute("fill-rule", "evenodd");
        target.setAttribute("data-note", note);
        target.setAttribute("data-octave", String(octave));
        target.setAttribute("role", "button");
        target.setAttribute("aria-label", `Set ${displayName(note, false)} as Camp`);
        target.addEventListener("click", () => setCustomCamp(target));
        target.addEventListener("keydown", event => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          setCustomCamp(target);
        });
        layer.appendChild(target);
      });
    });
    updateCampTargets();
  }

  function renderLandmarks(){
    document.querySelectorAll("#labels-layer .landmark-marker").forEach(el => el.remove());
    const camp = selectedScale ? normalize(selectedScale) : customCamp;
    if (selectedLandmarks.size === 0) return;

    const layer = document.getElementById("labels-layer");
    const octList = showingTwo ? [1,2] : [1];
    const pathNotes = new Set(selectedScale
      ? (MAJOR[selectedScale] || []).map(normalize)
      : manualOn);

    octList.forEach(oct => {
      const stacks = {};
      const placed = new Set();

      const place = (landmark, note, point) => {
        const dedupe = note + "|" + (point.emoji || point.shape);
        if (placed.has(dedupe)) return;
        placed.add(dedupe);
        const x = xFor(note, oct);
        const baseY = BLACK_KEYS.includes(note)
          ? (GEOM.groupY + GEOM.blackDotY - 20 * MARKER_SCALE)
          : (GEOM.groupY + GEOM.whiteDotY - 22 * MARKER_SCALE);
        const level = stacks[note] = (stacks[note] || 0) + 1;
        const y = baseY - (level - 1) * MARKER_STACK_GAP;

        if (point.shape === "flag") {
          const onPath = pathNotes.has(note);
          const fill = onPath ? TRACK_COLORS[point.color] : "#ffffff";
          const stroke = onPath ? TRACK_COLORS[point.color] : TRACK_COLORS.grey;
          const pole = onPath ? "#333333" : TRACK_COLORS.grey;
          const group = document.createElementNS(SVG_NS, "g");
          group.setAttribute("transform", `translate(${x - 5 * MARKER_SCALE}, ${y - 22 * MARKER_SCALE}) scale(${MARKER_SCALE})`);
          group.setAttribute("class", "landmark-marker");
          group.setAttribute("data-landmark", landmark.id);
          group.setAttribute("data-note", note);
          group.setAttribute("data-octave", String(oct));
          group.setAttribute("aria-hidden", "true");
          group.innerHTML =
            `<line x1="0" y1="0" x2="0" y2="22" stroke="${pole}" stroke-width="1.6"/>` +
            `<circle cx="0" cy="0" r="1.6" fill="${pole}"/>` +
            `<path d="M0,2 C5,-1 9,4 14,1 L14,9 C9,12 5,7 0,10 Z" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>`;
          layer.appendChild(group);
          return;
        }

        if (point.shape === "star") {
          const group = document.createElementNS(SVG_NS, "g");
          group.setAttribute("transform", `translate(${x}, ${y - 8 * MARKER_SCALE}) scale(${MARKER_SCALE})`);
          group.setAttribute("class", "landmark-marker");
          group.setAttribute("data-landmark", landmark.id);
          group.setAttribute("data-note", note);
          group.setAttribute("data-octave", String(oct));
          group.setAttribute("aria-hidden", "true");
          group.innerHTML = `<polygon points="0,-9 2.1,-2.9 8.6,-2.8 3.4,1.1 5.3,7.3 0,3.6 -5.3,7.3 -3.4,1.1 -8.6,-2.8 -2.1,-2.9" fill="#2EAE4F" stroke="#1B7A36" stroke-width="1"/>`;
          layer.appendChild(group);
          return;
        }

        const marker = document.createElementNS(SVG_NS, "text");
        marker.setAttribute("x", String(x));
        marker.setAttribute("y", String(y));
        marker.setAttribute("class", "landmark-marker");
        marker.setAttribute("data-landmark", landmark.id);
        marker.setAttribute("data-note", note);
        marker.setAttribute("data-octave", String(oct));
        marker.setAttribute("aria-hidden", "true");
        marker.textContent = point.emoji;
        layer.appendChild(marker);
      };

      const drawArrow = (landmark, fromNote, toNote, color, direction) => {
        const x1 = xFor(fromNote, oct);
        const fromLocalX = xFor(fromNote, 1);
        const toLocalX = xFor(toNote, 1);
        let targetOct = oct;

        if (direction > 0 && toLocalX < fromLocalX) targetOct += 1;
        if (direction < 0 && toLocalX > fromLocalX) targetOct -= 1;
        const wrapsSingleOctave = !showingTwo && (targetOct < 1 || targetOct > 1);
        if (!wrapsSingleOctave && (targetOct < 1 || targetOct > 2)) return;
        if (wrapsSingleOctave) targetOct = oct;

        const x2 = xFor(toNote, targetOct);
        if (x1 === x2) return;
        const y = GEOM.groupY + GEOM.whiteH - 8 * MARKER_SCALE;
        const dir = wrapsSingleOctave ? direction : (x2 > x1 ? 1 : -1);

        const appendLine = (startX, endX) => {
          const line = document.createElementNS(SVG_NS, "line");
          line.setAttribute("x1", String(startX));
          line.setAttribute("y1", String(y));
          line.setAttribute("x2", String(endX));
          line.setAttribute("y2", String(y));
          line.setAttribute("stroke", color);
          line.setAttribute("stroke-width", String(2.5 * MARKER_SCALE));
          line.setAttribute("class", "landmark-marker");
          line.setAttribute("data-landmark", landmark.id);
          line.setAttribute("aria-hidden", "true");
          layer.appendChild(line);
        };

        if (wrapsSingleOctave) {
          const octaveStart = groupBase(oct);
          const octaveEnd = octaveStart + GEOM.unit1W + GEOM.unit2W;
          appendLine(x1, direction > 0 ? octaveEnd : octaveStart);
          appendLine(direction > 0 ? octaveStart : octaveEnd, x2 - dir * 8 * MARKER_SCALE);
        } else {
          appendLine(x1, x2 - dir * 8 * MARKER_SCALE);
        }

        const head = document.createElementNS(SVG_NS, "polygon");
        head.setAttribute("points", `${x2},${y} ${x2 - dir * 9 * MARKER_SCALE},${y - 5 * MARKER_SCALE} ${x2 - dir * 9 * MARKER_SCALE},${y + 5 * MARKER_SCALE}`);
        head.setAttribute("fill", color);
        head.setAttribute("class", "landmark-marker");
        head.setAttribute("data-landmark", landmark.id);
        head.setAttribute("aria-hidden", "true");
        layer.appendChild(head);
      };

      LANDMARK_MARKERS.forEach(landmark => {
        if (!selectedLandmarks.has(landmark.id)) return;
        if (landmark.type === "relative" && !camp) return;

        landmark.points.forEach(point => {
          const note = landmark.type === "fixed" ? point.note : noteFromCamp(camp, point.semis);
          place(landmark, note, point);
        });

        if (landmark.arrow && showArrows) {
          const direction = ((landmark.arrow.toSemis - landmark.arrow.fromSemis + 18) % 12) - 6;
          drawArrow(
            landmark,
            noteFromCamp(camp, landmark.arrow.fromSemis),
            noteFromCamp(camp, landmark.arrow.toSemis),
            landmark.arrow.color,
            direction
          );
        }
      });
    });
  }

  function clearNoteLabels(){
    document.querySelectorAll("#labels-layer .note-label").forEach(el=>el.remove());
  }

  function showNoteLabels(scaleName, notes, preferSharpsFlag){
    clearNoteLabels();
    const layer = document.getElementById("labels-layer");
    const mode  = document.getElementById("label-mode").value;

    // Scale degree texts — repeated tonic is "1" (no parentheses)
    const degNames = {};
    notes.forEach((n,i)=>{ degNames[normalize(n)] = (i===notes.length-1) ? "1" : String(i+1); });

    // Choose baseline. IMPORTANT: both values are > keyBottom (so below keys).
    const baseline = (unitLabelPos === "below")
      ? Y.labelBelowWhenUnitsBelow
      : Y.labelBelowDefault;

    const octList = showingTwo ? [1,2] : [1];
    const physicalNotes = Array.from(new Set(notes.map(normalize)));

    octList.forEach(oct=>{
      physicalNotes.forEach(nRaw=>{
        const n = normalize(nRaw);
        const text = (mode==="letters") ? displayName(n, preferSharpsFlag) : degNames[n];
        if (!text) return;

        const lbl = document.createElementNS("http://www.w3.org/2000/svg","text");
        lbl.setAttribute("x", xFor(n, oct));
        lbl.setAttribute("y", baseline);
        lbl.setAttribute("class", "note-label");
        lbl.textContent = text;
        layer.appendChild(lbl);
      });
    });
  }

  /* =============================
     Wire up UI controls
     ============================= */
  document.getElementById("toggle-start").addEventListener("click", ()=>{
    startOnUnit1 = !startOnUnit1;
    applyStartLayout();
    if (showingLabels) {
      const s = selectedScale;
      const notes = s ? MAJOR[s] : Array.from(manualOn);
      showNoteLabels(s || "Free", notes, s ? prefersSharps(s) : false);
    }
    renderLandmarks();
  });

  document.getElementById("unit-label-pos").addEventListener("change", (e)=>{
    unitLabelPos = e.target.value;
    applyStartLayout(); // reposition labels
    if (showingLabels) {
      const s = selectedScale;
      const notes = s ? MAJOR[s] : Array.from(manualOn);
      showNoteLabels(s || "Free", notes, s ? prefersSharps(s) : false);
    }
  });

  document.getElementById("toggle-octaves").addEventListener("click", ()=>{
    showingTwo = !showingTwo;
    const disp = showingTwo ? "inline" : "none";
    ["oct2","oct2-title","oct2-left-label","oct2-right-label"].forEach(id=>{
      const el = document.getElementById(id);
      if (el) el.style.display = disp;
    });
    document.getElementById("toggle-octaves").textContent =
      showingTwo ? "Show One Octave" : "Show Two Octaves";
    updateSingleOctaveView();
    applyStartLayout(); // ensures Octave 2 unit labels stay hidden in single-octave
    if (selectedScale) applyScaleDots(); else applyManualDots();
    if (showingLabels) {
      const s = selectedScale;
      const notes = s ? MAJOR[s] : Array.from(manualOn);
      showNoteLabels(s || "Free", notes, s ? prefersSharps(s) : false);
    }
    renderLandmarks();
  });


  document.getElementById("label-mode").addEventListener("change", (e)=>{
    const mode = e.target.value;
    if (mode === "hide") {
      showingLabels = false;
      clearNoteLabels();
    } else {
      showingLabels = true;
      const s = selectedScale;
      const notes = s ? MAJOR[s] : Array.from(manualOn);
      showNoteLabels(s || "Free", notes, s ? prefersSharps(s) : false);
    }
  });

  document.getElementById("scale-select").addEventListener("change", e=>{
    selectedScale = e.target.value;
    updateCampTargets();
    document.querySelectorAll(".dot").forEach(d => d.classList.add("hidden"));
    if (!selectedScale) {
      applyManualDots();
      if (showingLabels) showNoteLabels("Free", Array.from(manualOn), false);
      renderLandmarks();
      return;
    }
    applyScaleDots();
    if (showingLabels) showNoteLabels(selectedScale, MAJOR[selectedScale], prefersSharps(selectedScale));
    renderLandmarks();
  });

  /* =============================
     Landmarks dropdown behavior
     ============================= */
  const landmarksBtn = document.getElementById("landmarks-btn");
  const landmarksMenu = document.getElementById("landmarks-menu");
  const landmarkChecks = Array.from(document.querySelectorAll(".lm-check"));
  const selectAllCheck = document.getElementById("lm-select-all");
  const landmarksMenuHome = landmarksMenu.parentElement;
  const mobileLandmarksMenu = window.matchMedia(
    "(max-width: 768px), (hover: none), (pointer: coarse)"
  );

  function updateLandmarksMenuPortal() {
    // Mobile browsers can clip a fixed descendant to the overflowing controls
    // strip. Portal only there; preserve the established desktop DOM behavior.
    const target = mobileLandmarksMenu.matches ? document.body : landmarksMenuHome;
    if (landmarksMenu.parentElement !== target) target.appendChild(landmarksMenu);
  }

  updateLandmarksMenuPortal();

  landmarksBtn.addEventListener("click", e => {
    e.stopPropagation();
    const opening = landmarksMenu.hidden;
    if (opening) {
      const r = landmarksBtn.getBoundingClientRect();
      landmarksMenu.style.top = (r.bottom + 4) + "px";
      landmarksMenu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 290)) + "px";
    }
    landmarksMenu.hidden = !opening;
    landmarksBtn.setAttribute("aria-expanded", String(opening));
    if (opening) selectAllCheck.focus();
  });

  landmarksMenu.addEventListener("click", e => e.stopPropagation());

  landmarksMenu.addEventListener("keydown", e => {
    const menuInputs = Array.from(landmarksMenu.querySelectorAll("input"));
    if (e.key === "Escape") {
      e.preventDefault();
      closeLandmarksMenu({ restoreFocus: true });
    } else if (e.key === "Tab" && e.shiftKey && e.target === menuInputs[0]) {
      e.preventDefault();
      closeLandmarksMenu();
      landmarksBtn.focus();
    } else if (e.key === "Tab" && !e.shiftKey && e.target === menuInputs.at(-1)) {
      e.preventDefault();
      closeLandmarksMenu();
      document.getElementById("toggle-octaves").focus();
    }
  });

  function closeLandmarksMenu({ restoreFocus = false } = {}){
    const focusWasInMenu = landmarksMenu.contains(document.activeElement);
    landmarksMenu.hidden = true;
    landmarksBtn.setAttribute("aria-expanded", "false");
    if (restoreFocus || focusWasInMenu) landmarksBtn.focus({ preventScroll: true });
  }

  document.addEventListener("click", closeLandmarksMenu);
  document.querySelector(".controls").addEventListener("scroll", closeLandmarksMenu);
  window.addEventListener("resize", () => {
    closeLandmarksMenu();
    updateLandmarksMenuPortal();
  });

  document.getElementById("lm-arrows").addEventListener("change", e => {
    showArrows = e.target.checked;
    renderLandmarks();
  });

  function updateLandmarkSelection(){
    selectedLandmarks = new Set(landmarkChecks.filter(c => c.checked).map(c => c.value));
    selectAllCheck.checked = selectedLandmarks.size === landmarkChecks.length;
    selectAllCheck.indeterminate = selectedLandmarks.size > 0 && selectedLandmarks.size < landmarkChecks.length;
    landmarksBtn.textContent = selectedLandmarks.size > 0
      ? `Landmarks & Characters (${selectedLandmarks.size})`
      : "Landmarks & Characters";
    renderLandmarks();
  }

  landmarkChecks.forEach(c => c.addEventListener("change", updateLandmarkSelection));
  selectAllCheck.addEventListener("change", () => {
    landmarkChecks.forEach(c => c.checked = selectAllCheck.checked);
    updateLandmarkSelection();
  });

  /* =============================
     Mobile header collapse on scroll
     ============================= */
  let lastScrollY = window.scrollY;
  const header = document.querySelector('header');

  function handleScroll() {
    if (window.innerWidth <= 768) {
      if (window.scrollY > lastScrollY && window.scrollY > 50) {
        // Scrolling down - collapse header
        header.classList.add('header-collapsed');
      } else if (window.scrollY < lastScrollY) {
        // Scrolling up - show full header
        header.classList.remove('header-collapsed');
      }
    } else {
      // Desktop - always show full header
      header.classList.remove('header-collapsed');
    }
    lastScrollY = window.scrollY;
  }

  window.addEventListener('scroll', handleScroll);
  window.addEventListener('resize', handleScroll);

  /* =============================
     Initial setup
     ============================= */
  applyStartLayout();
  updateSingleOctaveView();
  createCampTargets();
  window.addEventListener("resize", updateSingleOctaveView);

  // Default FREE-MODE starter: red track (C D E F# G# A#)
  ["C","D","E","F#","G#","A#"].forEach(n => manualOn.add(toFlat(n)));
  applyManualDots();
</script>

</body>
